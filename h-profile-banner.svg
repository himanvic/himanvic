<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">H — sci-fi developer profile banner</title>
  <desc id="desc">A holographic H emblem surrounded by orbital rings, a glowing grid, a scan line, and interface panels for C++ and Python.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060914"/>
      <stop offset="52%" stop-color="#0B1230"/>
      <stop offset="100%" stop-color="#160D2B"/>
    </linearGradient>
    <linearGradient id="hFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8FBFF"/>
      <stop offset="35%" stop-color="#67E8F9"/>
      <stop offset="70%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#67E8F9" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".28"/>
      <stop offset="55%" stop-color="#6366F1" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#6EE7F9" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <pattern id="microgrid" width="9" height="9" patternUnits="userSpaceOnUse">
      <path d="M9 0H0V9" fill="none" stroke="#A78BFA" stroke-opacity=".045" stroke-width=".6"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="clip"><rect width="1200" height="360" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <rect width="1200" height="360" fill="url(#microgrid)"/>
    <ellipse cx="355" cy="176" rx="300" ry="260" fill="url(#coreGlow)"/>
    <ellipse cx="1000" cy="170" rx="320" ry="270" fill="#8B5CF6" opacity=".055" filter="url(#softGlow)"/>

    <!-- distant stars / system particles -->
    <g fill="#A5F3FC">
      <circle cx="70" cy="53" r="1.5" opacity=".6"/><circle cx="132" cy="280" r="1.2" opacity=".7"/>
      <circle cx="205" cy="95" r="1" opacity=".5"/><circle cx="522" cy="55" r="1.4" opacity=".65"/>
      <circle cx="558" cy="270" r="1.2" opacity=".5"/><circle cx="673" cy="58" r="1" opacity=".7"/>
      <circle cx="788" cy="313" r="1.4" opacity=".6"/><circle cx="930" cy="57" r="1.1" opacity=".65"/>
      <circle cx="1115" cy="98" r="1.3" opacity=".7"/><circle cx="1140" cy="291" r="1.1" opacity=".6"/>
      <circle cx="1010" cy="329" r="1.1" opacity=".6"/><circle cx="715" cy="222" r=".9" opacity=".7"/>
    </g>
    <g stroke="#67E8F9" stroke-width="1" opacity=".32">
      <path d="M70 82h32m-16-16v32"/><path d="M1080 58h24m-12-12v24"/>
      <path d="M1110 280h20m-10-10v20"/><path d="M140 318h24m-12-12v24"/>
    </g>

    <!-- emblem rings -->
    <circle cx="350" cy="178" r="127" fill="none" stroke="#67E8F9" stroke-opacity=".15" stroke-width="1"/>
    <circle cx="350" cy="178" r="112" fill="none" stroke="#60A5FA" stroke-opacity=".34" stroke-width="1.2" stroke-dasharray="3 9"/>
    <circle cx="350" cy="178" r="96" fill="none" stroke="#A78BFA" stroke-opacity=".55" stroke-width="1.4" stroke-dasharray="68 18 5 18">
      <animateTransform attributeName="transform" type="rotate" from="0 350 178" to="360 350 178" dur="34s" repeatCount="indefinite"/>
    </circle>
    <ellipse cx="350" cy="178" rx="139" ry="47" fill="none" stroke="#22D3EE" stroke-opacity=".28" stroke-width="1.2" transform="rotate(-28 350 178)"/>
    <ellipse cx="350" cy="178" rx="139" ry="47" fill="none" stroke="#A78BFA" stroke-opacity=".42" stroke-width="1.2" transform="rotate(36 350 178)" stroke-dasharray="50 18 7 18">
      <animateTransform attributeName="transform" additive="sum" type="rotate" from="0 350 178" to="-360 350 178" dur="48s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="350" cy="178" r="74" fill="#0B1633" fill-opacity=".65" stroke="#67E8F9" stroke-opacity=".45" stroke-width="1.5"/>
    <circle cx="350" cy="178" r="66" fill="none" stroke="#D8FBFF" stroke-opacity=".16" stroke-width="1"/>
    <circle cx="350" cy="178" r="81" fill="none" stroke="#67E8F9" stroke-opacity=".45" stroke-width="2" stroke-dasharray="2 13">
      <animate attributeName="stroke-opacity" values=".18;.62;.18" dur="4.5s" repeatCount="indefinite"/>
    </circle>

    <!-- H hologram -->
    <text x="350" y="216" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="113" font-weight="800" fill="#22D3EE" opacity=".65" filter="url(#glow)">H</text>
    <text x="350" y="216" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="113" font-weight="800" fill="url(#hFill)" stroke="#E0FCFF" stroke-opacity=".8" stroke-width=".8">H</text>
    <path d="M295 202h110" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="1"/>
    <path d="M303 207h94" stroke="#67E8F9" stroke-opacity=".8" stroke-width="1.4"/>

    <!-- scanline sweeps across the hologram -->
    <rect x="210" y="0" width="280" height="3" fill="url(#line)" opacity=".8">
      <animate attributeName="y" values="18;330;18" dur="7.5s" repeatCount="indefinite"/>
    </rect>

    <!-- angular UI corners around emblem -->
    <g fill="none" stroke="#67E8F9" stroke-width="1.5" stroke-opacity=".58">
      <path d="M230 85h28l12 12M230 85v28"/><path d="M470 85h-28l-12 12M470 85v28"/>
      <path d="M230 271h28l12-12M230 271v-28"/><path d="M470 271h-28l-12-12M470 271v-28"/>
    </g>

    <!-- right-hand interface -->
    <path d="M565 54h1v252h-1" stroke="#67E8F9" stroke-opacity=".26"/>
    <path d="M596 72H1108L1128 92V285L1108 305H596" fill="#080E21" fill-opacity=".48" stroke="#67E8F9" stroke-opacity=".26" stroke-width="1.2"/>
    <path d="M596 72h190M1030 72h78l20 20M596 305h145M1060 305h48l20-20" fill="none" stroke="#67E8F9" stroke-opacity=".65" stroke-width="2"/>
    <text x="625" y="105" fill="#7DD3FC" font-family="monospace" font-size="11" letter-spacing="3">CORE MODULES // 01</text>
    <circle cx="1080" cy="101" r="4" fill="#34D399" filter="url(#glow)">
      <animate attributeName="opacity" values="1;.35;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <text x="625" y="155" fill="#F0FDFF" font-family="monospace" font-size="25" font-weight="700">C++ <tspan fill="#67E8F9">/</tspan> PYTHON</text>
    <text x="625" y="178" fill="#8FA9CF" font-family="monospace" font-size="11" letter-spacing="1.6">PRIMARY LEARNING FOCUS</text>
    <path d="M625 199H1080" stroke="#36516F" stroke-width="1"/>
    <text x="625" y="224" fill="#7DD3FC" font-family="monospace" font-size="10" letter-spacing="2">DEVELOPMENT LOOP</text>
    <g font-family="monospace" font-size="13" font-weight="600">
      <rect x="625" y="241" width="112" height="30" rx="3" fill="#0E293C" stroke="#22D3EE" stroke-opacity=".65"/>
      <text x="681" y="260" text-anchor="middle" fill="#A5F3FC">LEARN</text>
      <path d="M744 256h19l-5-4m5 4-5 4" fill="none" stroke="#67E8F9" stroke-width="1.4"/>
      <rect x="774" y="241" width="112" height="30" rx="3" fill="#171A3D" stroke="#818CF8" stroke-opacity=".7"/>
      <text x="830" y="260" text-anchor="middle" fill="#C7D2FE">BUILD</text>
      <path d="M893 256h19l-5-4m5 4-5 4" fill="none" stroke="#A78BFA" stroke-width="1.4"/>
      <rect x="923" y="241" width="157" height="30" rx="3" fill="#201634" stroke="#C084FC" stroke-opacity=".7"/>
      <text x="1001" y="260" text-anchor="middle" fill="#E9D5FF">IMPROVE</text>
    </g>
    <text x="625" y="291" fill="#536C91" font-family="monospace" font-size="9" letter-spacing="2">H / PROFILE SIGNAL : ACTIVE</text>

    <!-- subtle moving dash along the lower edge -->
    <path d="M0 346H1200" stroke="#67E8F9" stroke-opacity=".12" stroke-width="1"/>
    <rect x="0" y="343" width="190" height="2" fill="url(#line)">
      <animate attributeName="x" values="-200;1200;-200" dur="9s" repeatCount="indefinite"/>
    </rect>
    <path d="M28 24h135M28 30h70M1035 329h137M1090 335h82" stroke="#A78BFA" stroke-opacity=".32" stroke-width="1"/>
  </g>
</svg>
