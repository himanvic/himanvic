<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="110" viewBox="0 0 280 110" role="img" aria-label="NaradNow">
  <defs>
    <linearGradient id="cardBg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E0F1B"/>
      <stop offset="100%" stop-color="#140D1E"/>
    </linearGradient>
  </defs>

  <!-- Card Base with subtle Crimson/Wine Border -->
  <rect x="1" y="1" width="278" height="108" rx="14" fill="url(#cardBg3)" stroke="#3D1D28" stroke-width="1.3"/>

  <!-- Icon Container -->
  <rect x="14" y="23" width="60" height="64" rx="12" fill="#1A121E" stroke="#3D1D28" stroke-width="1"/>
  
  <!-- Newspaper / News Feed Icon -->
  <g transform="translate(31, 36)">
    <!-- Folded Paper Sheet -->
    <rect x="0" y="2" width="26" height="34" rx="3" fill="#F8FAFC"/>
    
    <!-- Red News Masthead Banner -->
    <rect x="3" y="5" width="20" height="5" rx="1.5" fill="#EF4444"/>
    
    <!-- News Thumbnail Image Box -->
    <rect x="3" y="13" width="8" height="8" rx="1.5" fill="#64748B"/>
    
    <!-- Headline Lines beside photo -->
    <line x1="13" y1="15" x2="22" y2="15" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="13" y1="19" x2="20" y2="19" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Body Text Lines Below -->
    <line x1="3" y1="25" x2="22" y2="25" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="3" y1="29" x2="18" y2="29" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Card Typography -->
  <text x="86" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">NaradNow</text>
  <text x="86" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#94A3B8">Real news. Real time.</text>

  <!-- Arrow -->
  <g transform="translate(244, 76)">
    <path d="M0 6h16m-5-5 5 5-5 5" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>