<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="110" viewBox="0 0 280 110" role="img" aria-label="Mausam India">
  <defs>
    <linearGradient id="cardBg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090E1B"/>
      <stop offset="100%" stop-color="#0B1325"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="softGlow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card Base -->
  <rect x="1" y="1" width="278" height="108" rx="14" fill="url(#cardBg1)" stroke="#1E2E4A" stroke-width="1.2"/>

  <!-- Icon Container -->
  <rect x="14" y="23" width="60" height="64" rx="12" fill="#0D1A33" stroke="#1E2E4A" stroke-width="1"/>
  
  <!-- Weather Icon: Sun behind Cloud -->
  <g transform="translate(18, 26)">
    <!-- Sun rays -->
    <g stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" opacity="0.9">
      <line x1="22" y1="12" x2="22" y2="9"/>
      <line x1="15" y1="15" x2="13" y2="13"/>
      <line x1="12" y1="22" x2="9" y2="22"/>
      <line x1="29" y1="15" x2="31" y2="13"/>
    </g>
    <!-- Sun Disc -->
    <circle cx="22" cy="22" r="9" fill="#FBBF24" filter="url(#softGlow1)"/>
    
    <!-- Cloud -->
    <path d="M12 40h28a8 8 0 0 0 1-15.9 11 11 0 0 0-19.8-3.6 7.5 7.5 0 0 0-9.2 11.5A8 8 0 0 0 12 40z" fill="url(#cloudGrad)"/>
    <!-- Subtle Cloud Highlight -->
    <path d="M14 38h24a6.5 6.5 0 0 0 0-13 9 9 0 0 0-16.5-2.5" fill="none" stroke="#7DD3FC" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Card Typography -->
  <text x="86" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Mausam India</text>
  <text x="86" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#94A3B8">Weather insights for</text>
  <text x="86" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#94A3B8">a better tomorrow.</text>

  <!-- Arrow -->
  <g transform="translate(244, 76)">
    <path d="M0 6h16m-5-5 5 5-5 5" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>