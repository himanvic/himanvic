name: Update Live Profile Data

on:
  schedule:
    - cron: "0 */6 * * *"     # every 6 hours
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_profile.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild cards, terminal and stats from real GitHub data
        run: python scripts/update_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md
          git diff --staged --quiet || git commit -m "chore: refresh live profile data"
          git push
